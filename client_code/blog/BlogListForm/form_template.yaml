components:
- components:
  - components:
    - layout_properties: {grid_position: 'RTMUTB,DJXXMI'}
      name: hdg_blog_title
      properties: {text: Our Blog}
      type: form:dep_lhgtmc71xp5p:_Components.Heading
    - components:
      - data_bindings:
        - {code: 'self.item['''']', property: text, writeback: true}
        layout_properties: {}
        name: txt_search
        properties: {appearance: outlined, placeholder: Search posts...}
        type: form:dep_lhgtmc71xp5p:_Components.TextInput.TextBox
      layout_properties: {grid_position: 'AAAMEQ,IUUTBI'}
      name: flow_panel_1
      properties: {}
      type: FlowPanel
    - data_bindings:
      - {code: 'self.item['''']', property: selected_value, writeback: true}
      layout_properties: {grid_position: 'ERIRBU,RKXAUF'}
      name: dd_category_filter
      properties: {label: All Categories}
      type: form:dep_lhgtmc71xp5p:_Components.DropdownMenu
    - layout_properties: {grid_position: 'WHQYGP,XLYMGJ'}
      name: btn_tiled_view
      properties: {text: Tiled}
      type: form:dep_lhgtmc71xp5p:_Components.Button
    - layout_properties: {grid_position: 'WHQYGP,NASZMF'}
      name: btn_list_view
      properties: {appearance: outlined, text: List}
      type: form:dep_lhgtmc71xp5p:_Components.Button
    - components:
      - layout_properties: {grid_position: 'WMAUYE,YDCFVP'}
        name: rp_blog_tiled
        properties: {item_template: blog.BlogListForm.BlogListTiledTemplate}
        type: RepeatingPanel
      - layout_properties: {grid_position: 'WECFRF,YDLMPG'}
        name: rp_blog_list
        properties: {item_template: blog.BlogListForm.BlogListListTemplate}
        type: RepeatingPanel
      layout_properties: {grid_position: 'SADBJQ,XFCZHG'}
      name: col_tiled_view
      properties: {}
      type: ColumnPanel
    - components:
      - layout_properties: {}
        name: btn_prev_page
        properties: {appearance: outlined, text: Previous}
        type: form:dep_lhgtmc71xp5p:_Components.Button
      - layout_properties: {}
        name: txt_page_info
        properties: {text: Page 1 of 5}
        type: form:dep_lhgtmc71xp5p:_Components.Text
      - layout_properties: {}
        name: btn_next_page
        properties: {appearance: outlined, text: Next}
        type: form:dep_lhgtmc71xp5p:_Components.Button
      layout_properties: {grid_position: 'QFTKIO,WIMAXK'}
      name: flow_pagination
      properties: {}
      type: FlowPanel
    - components:
      - layout_properties: {grid_position: 'IOEYHW,QZIJCV'}
        name: icon_button_1
        properties: {icon: 'mi:article'}
        type: form:dep_lhgtmc71xp5p:_Components.IconButton
      - layout_properties: {grid_position: 'EPWTFR,PESMAY'}
        name: hdg_empty_state
        properties: {text: No blog posts yet}
        type: form:dep_lhgtmc71xp5p:_Components.Heading
      - layout_properties: {grid_position: 'XDLQRO,YCZNZD'}
        name: txt_empty_state
        properties: {text: Blog posts will appear here once published.}
        type: form:dep_lhgtmc71xp5p:_Components.Text
      - layout_properties: {grid_position: 'JQYLTF,JIRDHC'}
        name: btn_empty_action
        properties: {text: Create Your First Post}
        type: form:dep_lhgtmc71xp5p:_Components.Button
      layout_properties: {grid_position: 'PMMGXM,EWQOLT'}
      name: col_empty_state
      properties: {}
      type: ColumnPanel
    layout_properties: {grid_position: 'YAUVKH,JPCSXL'}
    name: col_blog_list
    properties: {}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: nav-right}
  name: navbar_links
  properties: {}
  type: FlowPanel
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
